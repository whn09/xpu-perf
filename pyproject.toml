[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpu-perf"
version = "0.1.0"
description = "XPU performance benchmarking toolkit"
requires-python = ">=3.9"
dependencies = [
    "prettytable", 
    "jsonlines", 
    "flask", 
    "requests", 
    # Neuron SDK (neuronx-cc, torch-neuronx, ml_dtypes) needs numpy>=2 on py3.12;
    # the old <=1.26.4 pin silently downgraded the DLAMI venv and broke every compile.
    "numpy<=1.26.4; python_version < '3.12'",
    "numpy>=2; python_version >= '3.12'"
]

[tool.setuptools.packages.find]
where = ["src"]
